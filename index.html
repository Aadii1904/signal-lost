<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Lost</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1>Signal Lost</h1>
      <p class="hint">Press <kbd>Space</kbd> or tap to jump over the luggage</p>
      <canvas id="game" tabindex="0" role="img" aria-label="Signal Lost: a backpacker runs along a road jumping over suitcases, cones and paper planes"></canvas>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
